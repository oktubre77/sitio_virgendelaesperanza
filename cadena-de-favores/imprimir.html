<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imprimir tarjetas · Cadena de favores</title>
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://www.peregrinosdelaesperanza.org/cadena-de-favores/">
    <link rel="icon" href="/icon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/cadena-de-favores/tarjeta.css">
    <style>
        body { margin: 0; background: #e9e4d8; color: #14284B; font-family: 'DM Sans', system-ui, sans-serif; }
        .panel { max-width: 640px; margin: 0 auto; padding: 24px 16px 8px; }
        .panel h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 1.6rem; margin: 0 0 8px; }
        .panel p { margin: 0 0 14px; line-height: 1.5; }
        .panel a { color: #14284B; }
        .controles { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 18px; }
        .controles label { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; font-weight: 500; }
        .controles input { font: inherit; width: 9rem; padding: 10px 12px; border: 1px solid #b9b2a2; border-radius: 8px; background: #fff; }
        .boton { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 12px 22px; background: #14284B; color: #fff; cursor: pointer; }
        .boton:hover { background: #0d1c37; }
        .hoja { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; padding: 8px 16px 40px; }
        /* Línea de corte alrededor de cada tarjeta. */
        .corte { outline: 1px dashed #9a927f; outline-offset: 0; }

        @media print {
            @page { size: A4 portrait; margin: 0; }
            body { background: #fff; }
            .panel { display: none; }
            /* Cuatro tarjetas por hoja A4, un poco más chicas que A6 para que
               ninguna impresora las recorte por los márgenes. */
            .hoja {
                width: 210mm; height: 297mm; padding: 0; gap: 4mm;
                display: grid; grid-template-columns: repeat(2, auto);
                align-content: center; justify-content: center;
            }
            .cf-tarjeta { font-size: 3.3mm; break-inside: avoid; }
            .corte { outline: 0.2mm dashed #aaa; }
        }
    </style>
</head>
<body>
    <div class="panel">
        <h1>Imprimir tarjetas</h1>
        <p>Salen cuatro tarjetas por hoja A4, con una línea punteada para cortarlas. Si vas a empezar
           una cadena nueva, poné <strong>1</strong> como número de eslabón; si no, dejalo vacío y se escribe a mano.</p>
        <div class="controles">
            <label>Número de eslabón
                <input id="numero" type="number" min="1" inputmode="numeric" placeholder="A mano">
            </label>
            <button class="boton" type="button" onclick="window.print()">Imprimir</button>
        </div>
        <p><a href="/cadena-de-favores/">← Volver a la cadena de favores</a></p>
    </div>

    <div class="hoja" id="hoja"></div>

    <template id="molde">
        <article class="cf-tarjeta corte" aria-label="Tarjeta de la cadena de favores">
            <div class="cf-marco">
                <p class="cf-etiqueta">Cadena de favores</p>
                <h2 class="cf-titulo">Alguien te ayudó. Ahora ayudá vos a otra persona.</h2>
                <p class="cf-subtitulo">No me devuelvas el favor: pasalo. Cuando lo hagas, la cadena sigue.</p>
                <blockquote class="cf-versiculo">“No amemos de palabra, sino con obras y de verdad.”<cite>1 Jn 3,18</cite></blockquote>
                <div class="cf-eslabon">
                    <p class="cf-eslabon-numero">Eslabón N.º <span class="cf-eslabon-valor">&nbsp;</span></p>
                    <p class="cf-eslabon-ayuda">Cuando la pases, actualizá el número de eslabón: sumá 1.</p>
                </div>
                <div class="cf-pie">
                    <div class="cf-qr"><img src="/cadena-de-favores/qr-cadena.svg" alt="Código QR a peregrinosdelaesperanza.org/cadena-de-favores"></div>
                    <p class="cf-pie-texto"><strong>Conocé más y sumate a la cadena</strong><span class="cf-pie-url">peregrinosdelaesperanza.org</span></p>
                </div>
            </div>
        </article>
    </template>

    <script>
        const hoja = document.getElementById('hoja');
        const molde = document.getElementById('molde');
        for (let i = 0; i < 4; i++) hoja.appendChild(molde.content.cloneNode(true));

        const numero = document.getElementById('numero');
        numero.addEventListener('input', () => {
            const n = parseInt(numero.value, 10);
            const texto = n > 0 ? String(n) : ' ';
            hoja.querySelectorAll('.cf-eslabon-valor').forEach(el => { el.textContent = texto; });
        });
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
